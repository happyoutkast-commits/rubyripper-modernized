name: CI

on:
  push:
    branches:
      - main
      - modernization
  pull_request:

jobs:
  test:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.2"
            bundler: "2.4.20"
            label: "Mint/Ubuntu package baseline"
          - ruby: "3.2"
            bundler: "4.0.18"
            label: "Ruby 3.2 / Bundler 4"
          - ruby: "3.3"
            bundler: "4.0.18"
            label: "Ruby 3.3 / Bundler 4"
          - ruby: "3.4"
            bundler: "4.0.18"
            label: "Ruby 3.4 / Bundler 4"
          - ruby: "4.0"
            bundler: "4.0.18"
            label: "Ruby 4.0 / Bundler 4"

    env:
      BUNDLE_WITHOUT: gui:i18n

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: ${{ matrix.bundler }}
          bundler-cache: true

      - name: Run RSpec suite
        run: bundle exec rspec

      - name: Run Cucumber suite
        run: bundle exec cucumber
